name: Refresh README Timestamp

on:
  schedule:
    - cron: "0 0 * * *"    # daily at 00:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update last-updated marker
        run: |
          NOW="$(date -u '+%Y-%m-%d %H:%M UTC')"
          sed -i -E "s|(<!--LAST_UPDATED-->).*(<!--END_LAST_UPDATED-->)|\1${NOW}\2|" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: refresh README timestamp [skip ci]"
          git push
