name: Sync README Content

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-sync
  cancel-in-progress: false

jobs:
  recent-activity:
    name: Refresh Recent GitHub Activity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Recent Activity
        uses: jamesgeorge007/github-activity-readme@v0.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "chore: refresh recent activity [skip ci]"
          MAX_LINES: "5"

  update-timestamp:
    name: Update README Timestamp
    needs: recent-activity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Timestamp
        run: |
          NOW="$(date -u '+%Y-%m-%d %H:%M UTC')"
          NOW_BADGE="$(date -u '+%Y--%m--%d')"

          sed -i -E "s|(<!--LAST_UPDATED-->).*(<!--END_LAST_UPDATED-->)|\1${NOW}\2|" README.md
          sed -i -E "s|(<!--LAST_UPDATED_BADGE-->).*(<!--END_LAST_UPDATED_BADGE-->)|\1${NOW_BADGE}\2|" README.md

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: sync README [skip ci]"
          git pull --rebase origin main
          git push
