name: Update Public Repo Count

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Public Repository Count
        id: repos
        run: |
          COUNT=$(curl -s https://api.github.com/users/${{ github.repository_owner }} | jq -r '.public_repos')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Update README
        env:
          COUNT: ${{ steps.repos.outputs.count }}
        run: |
          python3 - <<'EOF'
          import os
          import re

          count = os.environ["COUNT"]

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          replacement = (
              "<!--START_SECTION:public_repos-->\n"
              f'<img src="https://img.shields.io/badge/Public%20Repos-{count}-00E8FF?style=flat-square&labelColor=0B1E3B" '
              'alt="Public Repositories"/>\n'
              "<!--END_SECTION:public_repos-->"
          )

          pattern = r"<!--START_SECTION:public_repos-->.*?<!--END_SECTION:public_repos-->"

          content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore: update public repo count [skip ci]"
          git push
