name: Update Public Repo Count

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get public repo count
        id: repos
        run: |
          COUNT=$(curl -s https://api.github.com/users/Chandru9842 | jq -r '.public_repos')
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Update README
        env:
          COUNT: ${{ steps.repos.outputs.count }}
        run: |
          python3 <<EOF
          import re
          import os

          count = os.environ["COUNT"]

          with open("README.md", "r", encoding="utf-8") as f:
              data = f.read()

          replacement = f"""<!--START_SECTION:public_repos-->
<img src="https://img.shields.io/badge/Public%20Repos-{count}-8B5CF6?style=flat-square&labelColor=161B22" alt="Public Repositories"/>
<!--END_SECTION:public_repos-->"""

          data = re.sub(
              r'<!--START_SECTION:public_repos-->[\s\S]*?<!--END_SECTION:public_repos-->',
              replacement,
              data
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(data)
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update public repo count"
            git push
          fi
