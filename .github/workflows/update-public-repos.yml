name: Update Public Repo Count

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "0 0 * * *"   # Every day at 00:00 UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Public Repository Count
        id: repos
        run: |
          COUNT=$(curl -s https://api.github.com/users/${{ github.repository_owner }} | jq -r '.public_repos')
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Update README
        env:
          COUNT: ${{ steps.repos.outputs.count }}
        run: |
          python3 <<EOF
          import re
          import os

          count = os.environ["COUNT"]

          with open("README.md", "r", encoding="utf-8") as f:
              data = f.read()

          pattern = r'<!--START_SECTION:public_repos-->.*?<!--END_SECTION:public_repos-->'

          replacement = f"""<!--START_SECTION:public_repos-->
<img src="https://img.shields.io/badge/Public%20Repos-{count}-8B5CF6?style=flat-square&labelColor=161B22" alt="Public Repositories"/>
<!--END_SECTION:public_repos-->"""

          data = re.sub(pattern, replacement, data, flags=re.DOTALL)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(data)
          EOF

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README already up-to-date."
            exit 0
          fi

          git commit -m "chore: update public repository count"

          git pull --rebase origin main

          git push
