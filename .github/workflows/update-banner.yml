name: Update Profile Banner, ASCII, LeetCode, GFG & WakaTime Stats

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-banner-profiles
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install Pillow

      - name: Generate Banner, LeetCode, GFG & WakaTime Stats SVGs
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          python build_hero_banner.py
          python generate_gfg_card.py
          python generate_leetcode_card.py
          python generate_wakatime_dashboard.py

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update profile banner, LeetCode, GFG and WakaTime stats [skip ci]"
          file_pattern: "dark.svg light.svg dark_mode.svg light_mode.svg assets/gfg-card*.svg assets/leetcode-card*.svg assets/wakatime-dashboard*.svg"
