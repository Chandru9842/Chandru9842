<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="Connect and Developer Collaboration">
  <defs>
    <style>
      .font-sans { font-family: 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, sans-serif; }
      .font-mono { font-family: 'Consolas', 'Courier New', 'Fira Code', 'JetBrains Mono', monospace; }
    </style>
    <linearGradient id="connectCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040F1D"/>
      <stop offset="100%" stop-color="#0B1E3B"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="880" height="200" rx="12" fill="url(#connectCardBg)" stroke="rgba(56, 189, 248, 0.22)" stroke-width="1.2"/>

  <!-- Header Section (Matching Pic 2 Header) -->
  <g transform="translate(28, 22)">
    <circle cx="6" cy="11" r="4.5" fill="#00E8FF"/>
    <text x="18" y="15" class="font-sans" font-size="15px" font-weight="700" fill="#00E8FF">Connect &amp; Collaborate</text>
    <text x="180" y="15" class="font-mono" font-size="11.5px" font-weight="600" fill="#8BB9FE">// Open for Full Stack &amp; Backend Roles</text>

    <!-- Status Badge -->
