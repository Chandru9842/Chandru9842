          <text x="14" y="9" class="font-sans" font-size="12px" font-weight="600" fill="#8BB9FE">Gmail</text>
          <text x="100" y="9" class="font-mono" font-size="11px" fill="#3B597E">: . . .</text>
          <text x="140" y="9" class="font-sans" font-size="11.5px" font-weight="600" fill="#FFFFFF">chandrumohan550@gmail.com</text>
        </g>
        
        <g transform="translate(28, 138)">
          <circle cx="4" cy="5" r="3.5" fill="#A78BFA"/>
          <text x="14" y="9" class="font-sans" font-size="12px" font-weight="600" fill="#8BB9FE">GitHub</text>
          <text x="100" y="9" class="font-mono" font-size="11px" fill="#3B597E">: . . .</text>
          <text x="140" y="9" class="font-sans" font-size="11.5px" font-weight="600" fill="#FFFFFF">github.com/Chandru9842</text>
        </g>
        

  <!-- Right Column Items -->
  
        <g transform="translate(450, 78)">
          <circle cx="4" cy="5" r="3.5" fill="#FFA116"/>
          <text x="14" y="9" class="font-sans" font-size="12px" font-weight="600" fill="#8BB9FE">LeetCode</text>
          <text x="100" y="9" class="font-mono" font-size="11px" fill="#3B597E">: . . .</text>
          <text x="140" y="9" class="font-sans" font-size="11.5px" font-weight="600" fill="#FFFFFF">leetcode.com/u/Chandrum06/</text>
