          <text x="100" y="9" class="font-mono" font-size="11px" fill="#3B597E">: . . .</text>
          <text x="140" y="9" class="font-sans" font-size="11.5px" font-weight="600" fill="#FFFFFF">linkedin.com/in/chandru9842</text>
        </g>
        
        <g transform="translate(28, 108)">
