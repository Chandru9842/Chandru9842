    <text x="0" y="0" class="font-sans" font-size="11.5px" font-weight="500" fill="#5B7CA3" text-anchor="middle">&quot;Great software is not just about writing code &#8212; it&apos;s about solving real problems with simplicity and scalability.&quot;</text>
