<svg xmlns="http://www.w3.org/2000/svg" width="790" height="195" viewBox="0 0 790 195" role="img" aria-label="Daily Developer Wisdom">
  <defs>
    <style>
      .font-sans { font-family: 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, sans-serif; }
      .font-mono { font-family: 'Consolas', 'Courier New', 'Fira Code', 'JetBrains Mono', monospace; }
    </style>
    <linearGradient id="quoteCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="790" height="195" rx="12" fill="url(#quoteCardBg)" stroke="rgba(15, 23, 42, 0.12)" stroke-width="1.2"/>

  <!-- Header Section (Matching Pic 2 Header) -->
  <g transform="translate(32, 22)">
    <circle cx="6" cy="11" r="4.5" fill="#0284C7"/>
    <text x="18" y="15" class="font-sans" font-size="15px" font-weight="700" fill="#0284C7">Daily Developer Wisdom</text>
    <text x="195" y="15" class="font-mono" font-size="11.5px" font-weight="600" fill="#475569">// Innovation &amp; Systems</text>

    <!-- Daily Sync Badge -->
    <g transform="translate(618, 0)">
      <rect width="104" height="24" rx="6" fill="rgba(2, 132, 199, 0.1)" stroke="#0284C7" stroke-width="0.8"/>
      <text x="52" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#0284C7" text-anchor="middle">DAILY SYNC</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="32" y1="56" x2="758" y2="56" stroke="rgba(15, 23, 42, 0.12)" stroke-width="1"/>

  <!-- Quote Body -->
  <text class="font-sans" font-size="14.5px" font-weight="600" fill="#0F172A">
    <tspan x="36" y="86" xml:space="preserve">The best way to predict the future is to invent it.</tspan>
  </text>

  <!-- Author Attribution -->
  <g transform="translate(36, 126)">
    <text x="0" y="0" class="font-sans" font-size="13px" font-weight="700" fill="#0284C7">— Alan Kay</text>
    <text x="12" y="16" class="font-sans" font-size="11.5px" font-weight="500" fill="#475569">Pioneer of Object-Oriented Programming &amp; GUI</text>
  </g>

</svg>
