<svg xmlns="http://www.w3.org/2000/svg" width="790" height="280" viewBox="0 0 790 280" role="img" aria-label="Current Focus and Objectives Dashboard">
  <defs>
    <style>
      .font-sans { font-family: 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; }
      .font-mono { font-family: 'Segoe UI', Ubuntu, monospace; }
    </style>
    <linearGradient id="focusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="glowTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="790" height="280" rx="16" fill="url(#focusGrad)" stroke="rgba(2, 132, 199, 0.25)" stroke-width="1.5"/>
  <rect x="0" y="0" width="790" height="3" fill="url(#glowTop)" rx="1.5"/>

  <!-- Header Header Telemetry -->
  <g transform="translate(32, 24)">
    <circle cx="8" cy="14" r="5" fill="#DB2777">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="19" class="font-sans" font-size="15.5px" font-weight="800" fill="#0F172A">🎯 CURRENT FOCUS &amp; ENGINEERING OBJECTIVES</text>
    <text x="22" y="34" class="font-mono" font-size="10.5px" font-weight="600" fill="#475569">Active Technical Roadmaps // Core Engineering Vectors</text>

    <!-- Telemetry Status Badge -->
    <g transform="translate(605, 2)">
      <rect width="122" height="26" rx="7" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-width="1"/>
      <text x="61" y="17" class="font-mono" font-size="10px" font-weight="700" fill="#059669" text-anchor="middle">ACTIVE MATRIX</text>
    </g>
  </g>

  <!-- Left Column Card: Core Mastery -->
  <g transform="translate(24, 76)">
    <rect width="362" height="184" rx="10" fill="rgba(241, 245, 249, 0.9)" stroke="rgba(0, 0, 0, 0.06)" stroke-width="1.2"/>
    <g transform="translate(16, -10)">
      <rect width="144" height="20" rx="5" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-width="1"/>
      <text x="72" y="14" class="font-sans" font-size="10px" font-weight="800" fill="#0284C7" text-anchor="middle">📚 CURRENTLY MASTERING</text>
    </g>
    
        <g transform="translate(16, 18)">
          <circle cx="6" cy="10" r="3.5" fill="#0284C7"/>
          <text x="16" y="14" class="font-sans" font-size="12.5px" font-weight="700" fill="#0F172A">System Design &amp; Distributed Systems</text>
          <text x="16" y="28" class="font-mono" font-size="10.5px" font-weight="600" fill="#475569">Scalability, Caching, Event-Driven</text>
          <g transform="translate(300, 2)">
            <rect width="48" height="18" rx="4" fill="#0284C7" fill-opacity="0.15" stroke="#0284C7" stroke-width="0.8"/>
            <text x="24" y="12.5" class="font-mono" font-size="8.5px" font-weight="700" fill="#0284C7" text-anchor="middle">CORE</text>
          </g>
        </g>
        
        <g transform="translate(16, 60)">
          <circle cx="6" cy="10" r="3.5" fill="#0284C7"/>
          <text x="16" y="14" class="font-sans" font-size="12.5px" font-weight="700" fill="#0F172A">Docker &amp; Containerization</text>
          <text x="16" y="28" class="font-mono" font-size="10.5px" font-weight="600" fill="#475569">Multi-stage builds, Container Orchestration</text>
          <g transform="translate(300, 2)">
            <rect width="48" height="18" rx="4" fill="#0284C7" fill-opacity="0.15" stroke="#0284C7" stroke-width="0.8"/>
            <text x="24" y="12.5" class="font-mono" font-size="8.5px" font-weight="700" fill="#0284C7" text-anchor="middle">DEVOPS</text>
          </g>
        </g>
        
        <g transform="translate(16, 102)">
          <circle cx="6" cy="10" r="3.5" fill="#0284C7"/>
          <text x="16" y="14" class="font-sans" font-size="12.5px" font-weight="700" fill="#0F172A">Spring Boot &amp; Security</text>
          <text x="16" y="28" class="font-mono" font-size="10.5px" font-weight="600" fill="#475569">Microservices, JWT, OAuth2 Auth Flows</text>
          <g transform="translate(300, 2)">
            <rect width="48" height="18" rx="4" fill="#0284C7" fill-opacity="0.15" stroke="#0284C7" stroke-width="0.8"/>
            <text x="24" y="12.5" class="font-mono" font-size="8.5px" font-weight="700" fill="#0284C7" text-anchor="middle">BACKEND</text>
          </g>
        </g>
        
        <g transform="translate(16, 144)">
          <circle cx="6" cy="10" r="3.5" fill="#0284C7"/>
          <text x="16" y="14" class="font-sans" font-size="12.5px" font-weight="700" fill="#0F172A">Advanced DSA &amp; Algorithms</text>
          <text x="16" y="28" class="font-mono" font-size="10.5px" font-weight="600" fill="#475569">Problem Solving, Optimization, Complexity</text>
          <g transform="translate(300, 2)">
            <rect width="48" height="18" rx="4" fill="#0284C7" fill-opacity="0.15" stroke="#0284C7" stroke-width="0.8"/>
            <text x="24" y="12.5" class="font-mono" font-size="8.5px" font-weight="700" fill="#0284C7" text-anchor="middle">LEETCODE</text>
          </g>
        </g>
        
  </g>

  <!-- Right Column Card: Active Engineering -->
  <g transform="translate(404, 76)">
    <rect width="362" height="184" rx="10" fill="rgba(241, 245, 249, 0.9)" stroke="rgba(0, 0, 0, 0.06)" stroke-width="1.2"/>
    <g transform="translate(16, -10)">
      <rect width="138" height="20" rx="5" fill="#059669" fill-opacity="0.2" stroke="#059669" stroke-width="1"/>
      <text x="69" y="14" class="font-sans" font-size="10px" font-weight="800" fill="#059669" text-anchor="middle">🚀 ACTIVE ENGINEERING</text>
    </g>
    
        <g transform="translate(16, 18)">
          <circle cx="6" cy="10" r="3.5" fill="#059669"/>
          <text x="16" y="14" class="font-sans" font-size="12.5px" font-weight="700" fill="#0F172A">AI Resume Analyzer &amp; Parser</text>
          <text x="16" y="28" class="font-mono" font-size="10.5px" font-weight="600" fill="#475569">Intelligent LLM Semantic Scoring Pipeline</text>
          <g transform="translate(300, 2)">
            <rect width="48" height="18" rx="4" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-width="0.8"/>
            <text x="24" y="12.5" class="font-mono" font-size="8.5px" font-weight="700" fill="#059669" text-anchor="middle">ACTIVE</text>
          </g>
        </g>
        
        <g transform="translate(16, 60)">
          <circle cx="6" cy="10" r="3.5" fill="#4F46E5"/>
          <text x="16" y="14" class="font-sans" font-size="12.5px" font-weight="700" fill="#0F172A">Developer CMS Platform</text>
          <text x="16" y="28" class="font-mono" font-size="10.5px" font-weight="600" fill="#475569">High-throughput modern portfolio engine</text>
          <g transform="translate(300, 2)">
            <rect width="48" height="18" rx="4" fill="#4F46E5" fill-opacity="0.15" stroke="#4F46E5" stroke-width="0.8"/>
            <text x="24" y="12.5" class="font-mono" font-size="8.5px" font-weight="700" fill="#4F46E5" text-anchor="middle">BUILDING</text>
          </g>
        </g>
        
        <g transform="translate(16, 102)">
          <circle cx="6" cy="10" r="3.5" fill="#4F46E5"/>
          <text x="16" y="14" class="font-sans" font-size="12.5px" font-weight="700" fill="#0F172A">Cloud CI/CD &amp; Deployments</text>
          <text x="16" y="28" class="font-mono" font-size="10.5px" font-weight="600" fill="#475569">Automated pipelines on Docker &amp; Cloudflare</text>
          <g transform="translate(300, 2)">
            <rect width="48" height="18" rx="4" fill="#4F46E5" fill-opacity="0.15" stroke="#4F46E5" stroke-width="0.8"/>
            <text x="24" y="12.5" class="font-mono" font-size="8.5px" font-weight="700" fill="#4F46E5" text-anchor="middle">INFRA</text>
          </g>
        </g>
        
        <g transform="translate(16, 144)">
          <circle cx="6" cy="10" r="3.5" fill="#059669"/>
          <text x="16" y="14" class="font-sans" font-size="12.5px" font-weight="700" fill="#0F172A">Open to New Opportunities</text>
          <text x="16" y="28" class="font-mono" font-size="10.5px" font-weight="600" fill="#475569">Full Stack &amp; Backend Engineering roles</text>
          <g transform="translate(300, 2)">
            <rect width="48" height="18" rx="4" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-width="0.8"/>
            <text x="24" y="12.5" class="font-mono" font-size="8.5px" font-weight="700" fill="#059669" text-anchor="middle">OPEN</text>
          </g>
        </g>
        
  </g>

</svg>
