      <text x="14" y="44" class="font-sans" font-size="14.5px" font-weight="800" fill="#0F172A">Wednesday</text>
      <text x="14" y="58" class="font-mono" font-size="9.5px" fill="#0284C7">7 hrs 12 mins</text>
