          <text x="100" y="9" class="font-mono" font-size="11px" fill="#CBD5E1">: . . .</text>
          <text x="140" y="9" class="font-sans" font-size="11.5px" font-weight="600" fill="#0F172A">chandrumohan550@gmail.com</text>
