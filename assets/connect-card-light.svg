      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="880" height="200" rx="12" fill="url(#connectCardBg)" stroke="rgba(15, 23, 42, 0.12)" stroke-width="1.2"/>

  <!-- Header Section (Matching Pic 2 Header) -->
  <g transform="translate(28, 22)">
    <circle cx="6" cy="11" r="4.5" fill="#0284C7"/>
