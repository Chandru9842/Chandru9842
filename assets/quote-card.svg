<svg xmlns="http://www.w3.org/2000/svg" width="790" height="195" viewBox="0 0 790 195" role="img" aria-label="Daily Developer Wisdom">
  <defs>
    <style>
      .font-sans { font-family: 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, sans-serif; }
      .font-mono { font-family: 'Consolas', 'Courier New', 'Fira Code', 'JetBrains Mono', monospace; }
    </style>
    <linearGradient id="quoteCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040F1D"/>
      <stop offset="100%" stop-color="#0B1E3B"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="790" height="195" rx="12" fill="url(#quoteCardBg)" stroke="rgba(56, 189, 248, 0.22)" stroke-width="1.2"/>

  <!-- Header Section (Matching Pic 2 Header) -->
  <g transform="translate(32, 22)">
    <circle cx="6" cy="11" r="4.5" fill="#00E8FF"/>
    <text x="18" y="15" class="font-sans" font-size="15px" font-weight="700" fill="#00E8FF">Daily Developer Wisdom</text>
    <text x="195" y="15" class="font-mono" font-size="11.5px" font-weight="600" fill="#8BB9FE">// Innovation &amp; Systems</text>

    <!-- Daily Sync Badge -->
    <g transform="translate(618, 0)">
      <rect width="104" height="24" rx="6" fill="rgba(0, 232, 255, 0.1)" stroke="#00E8FF" stroke-width="0.8"/>
      <text x="52" y="16" class="font-mono" font-size="10px" font-weight="700" fill="#00E8FF" text-anchor="middle">DAILY SYNC</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="32" y1="56" x2="758" y2="56" stroke="rgba(56, 189, 248, 0.22)" stroke-width="1"/>

  <!-- Quote Body -->
  <text class="font-sans" font-size="14.5px" font-weight="600" fill="#FFFFFF">
    <tspan x="36" y="86" xml:space="preserve">The best way to predict the future is to invent it.</tspan>
  </text>

  <!-- Author Attribution -->
  <g transform="translate(36, 126)">
    <text x="0" y="0" class="font-sans" font-size="13px" font-weight="700" fill="#00E8FF">— Alan Kay</text>
    <text x="12" y="16" class="font-sans" font-size="11.5px" font-weight="500" fill="#8BB9FE">Pioneer of Object-Oriented Programming &amp; GUI</text>
  </g>

</svg>
