<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" role="img" aria-label="Chandru M - LeetCode Stats">
  <defs>
    <style>
      .font-sans { font-family: 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; }
      .font-mono { font-family: 'Segoe UI', Ubuntu, monospace; }
      .t-title { font-size: 16px; font-weight: 700; fill: #0F172A; letter-spacing: -0.2px; }
      .t-sub { font-size: 11.5px; font-weight: 600; fill: #8BB9FE; }
      .t-num-big { font-size: 26px; font-weight: 700; fill: #0F172A; }
      .t-lbl-sm { font-size: 10px; font-weight: 600; fill: #8BB9FE; letter-spacing: 0.5px; text-transform: uppercase; }
      .t-diff-name { font-size: 12.5px; font-weight: 600; }
      .t-diff-val { font-size: 12.5px; font-weight: 700; fill: #0F172A; }
      .t-diff-total { font-size: 11px; font-weight: 600; fill: #8BB9FE; }
      .t-bottom-num { font-size: 18px; font-weight: 700; fill: #0F172A; }
      .t-bottom-lbl { font-size: 10px; font-weight: 600; fill: #8BB9FE; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
    <linearGradient id="lcGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA116"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="500" height="300" rx="16" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.12)" stroke-width="1.5"/>
  <rect x="8" y="8" width="484" height="284" rx="12" fill="#F8FAFC" fill-opacity="0.9"/>

  <!-- Header -->
  <g transform="translate(24, 20)">
    <!-- LeetCode Icon -->
    <g transform="translate(0, 2)">
      <rect width="28" height="28" rx="7" fill="#FFA116" fill-opacity="0.15"/>
      <path d="M 16.5,7.5 L 9.5,14.5 C 8.6,15.4 8.6,16.8 9.5,17.7 L 13.5,21.7 C 14.4,22.6 15.8,22.6 16.7,21.7 L 20.5,17.9 L 18.5,15.9 L 15.1,19.3 L 11.5,15.7 L 18.5,8.7 Z" fill="#FFA116"/>
      <path d="M 14,13.5 L 21.5,13.5 L 21.5,11 L 14,11 Z" fill="#FBBF24"/>
    </g>
    <text x="36" y="16" class="font-sans t-title">LeetCode</text>
    <text x="36" y="29" class="font-mono t-sub">@Chandrum06</text>

    <!-- Global Rank Badge -->
    <g transform="translate(320, 2)">
      <rect width="132" height="28" rx="8" fill="#FFA116" fill-opacity="0.15" stroke="#FFA116" stroke-width="1"/>
      <text x="66" y="18" text-anchor="middle" class="font-mono" font-size="11px" font-weight="700" fill="#FFA116">RANK: #594,489</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="24" y1="62" x2="476" y2="62" stroke="rgba(15, 23, 42, 0.12)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Center Section: Ring & Breakdown -->
  <g transform="translate(24, 76)">
    <!-- Circular Progress Donut Chart -->
    <g transform="translate(68, 62)">
      <!-- Background track -->
      <circle cx="0" cy="0" r="46" fill="none" stroke="#EDF2F7" stroke-width="9"/>
      
      <!-- Colored Segments (rotate -90 so starts at top) -->
      <g transform="rotate(-90)">
        <!-- Hard -->
        <circle cx="0" cy="0" r="46" fill="none" stroke="#FF375F" stroke-width="9"
          stroke-dasharray="15.39 289.03" stroke-dashoffset="-0.00"/>
        <!-- Medium -->
        <circle cx="0" cy="0" r="46" fill="none" stroke="#FFC01E" stroke-width="9"
          stroke-dasharray="158.25 289.03" stroke-dashoffset="-15.39"/>
        <!-- Easy -->
        <circle cx="0" cy="0" r="46" fill="none" stroke="#00B8A3" stroke-width="9"
          stroke-dasharray="115.39 289.03" stroke-dashoffset="-173.64"/>
      </g>

      <!-- Center Text -->
      <text x="0" y="4" text-anchor="middle" class="font-mono t-num-big">263</text>
      <text x="0" y="19" text-anchor="middle" class="font-sans t-lbl-sm">SOLVED</text>
    </g>

    <!-- Difficulty Breakdown List with Progress Bars & Totals (e.g. 105/961) -->
    <g transform="translate(160, 15)">
      <!-- Easy Row -->
      <g transform="translate(0, 0)">
        <rect width="292" height="28" rx="7" fill="#EDF2F7"/>
        <circle cx="16" cy="14" r="5" fill="#00B8A3"/>
        <text x="28" y="18" class="font-sans t-diff-name" fill="#00B8A3">Easy</text>
        <!-- Mini Progress Bar -->
        <rect x="74" y="11" width="100" height="6" rx="3" fill="#F8FAFC"/>
        <rect x="74" y="11" width="10" height="6" rx="3" fill="#00B8A3"/>
        <text x="280" y="18" text-anchor="end" class="font-mono">
          <tspan class="t-diff-val">105</tspan><tspan class="t-diff-total"> / 961</tspan>
        </text>
      </g>

      <!-- Medium Row -->
      <g transform="translate(0, 36)">
        <rect width="292" height="28" rx="7" fill="#EDF2F7"/>
        <circle cx="16" cy="14" r="5" fill="#FFC01E"/>
        <text x="28" y="18" class="font-sans t-diff-name" fill="#FFC01E">Med.</text>
        <!-- Mini Progress Bar -->
        <rect x="74" y="11" width="100" height="6" rx="3" fill="#F8FAFC"/>
        <rect x="74" y="11" width="6" height="6" rx="3" fill="#FFC01E"/>
        <text x="280" y="18" text-anchor="end" class="font-mono">
          <tspan class="t-diff-val">144</tspan><tspan class="t-diff-total"> / 2105</tspan>
        </text>
      </g>

      <!-- Hard Row -->
      <g transform="translate(0, 72)">
        <rect width="292" height="28" rx="7" fill="#EDF2F7"/>
        <circle cx="16" cy="14" r="5" fill="#FF375F"/>
        <text x="28" y="18" class="font-sans t-diff-name" fill="#FF375F">Hard</text>
        <!-- Mini Progress Bar -->
        <rect x="74" y="11" width="100" height="6" rx="3" fill="#F8FAFC"/>
        <rect x="74" y="11" width="2" height="6" rx="3" fill="#FF375F"/>
        <text x="280" y="18" text-anchor="end" class="font-mono">
          <tspan class="t-diff-val">14</tspan><tspan class="t-diff-total"> / 967</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- Divider -->
  <line x1="24" y1="214" x2="476" y2="214" stroke="rgba(15, 23, 42, 0.12)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Bottom Stats Metric Cards -->
  <g transform="translate(24, 226)">
    <!-- Metric 1: Total Solved -->
    <g transform="translate(0, 0)">
      <rect width="104" height="52" rx="8" fill="#EDF2F7"/>
      <text x="52" y="24" text-anchor="middle" class="font-mono t-bottom-num" fill="#FFA116">263</text>
      <text x="52" y="41" text-anchor="middle" class="font-sans t-bottom-lbl">TOTAL SOLVED</text>
    </g>

    <!-- Metric 2: Global Rank -->
    <g transform="translate(116, 0)">
      <rect width="104" height="52" rx="8" fill="#EDF2F7"/>
      <text x="52" y="24" text-anchor="middle" class="font-mono t-bottom-num">#594.5K</text>
      <text x="52" y="41" text-anchor="middle" class="font-sans t-bottom-lbl">GLOBAL RANK</text>
    </g>

    <!-- Metric 3: Acceptance Rate -->
    <g transform="translate(232, 0)">
      <rect width="104" height="52" rx="8" fill="#EDF2F7"/>
      <text x="52" y="24" text-anchor="middle" class="font-mono t-bottom-num" fill="#00B8A3">59.9%</text>
      <text x="52" y="41" text-anchor="middle" class="font-sans t-bottom-lbl">ACCEPTANCE</text>
    </g>

    <!-- Metric 4: Badges -->
    <g transform="translate(348, 0)">
      <rect width="104" height="52" rx="8" fill="#EDF2F7"/>
      <text x="52" y="24" text-anchor="middle" class="font-mono t-bottom-num" fill="#FFA116">🏅 3</text>
      <text x="52" y="41" text-anchor="middle" class="font-sans t-bottom-lbl">BADGES</text>
    </g>
  </g>
</svg>
